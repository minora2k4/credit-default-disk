# Cấu hình mặc định cho mọi ứng dụng Spark chạy từ image này. Có thể ghi đè bằng --conf khi spark-submit.

# --- Cluster ---
spark.master                          spark://spark-master:7077
# Driver chạy trong container của bạn (client mode): lắng nghe mọi địa chỉ để executor kết nối ngược về được.
# spark.driver.host để mặc định: trong network Docker, hostname của container phân giải ra đúng IP của nó.
spark.driver.bindAddress              0.0.0.0
spark.driver.memory                   1g
spark.executor.memory                 2g

# --- HDFS ---
spark.hadoop.fs.defaultFS             hdfs://namenode:8020
# Cụm chỉ có 1 DataNode: không đặt thì file Spark ghi ra xin 3 bản sao (mặc định HDFS) và bị báo thiếu bản sao
spark.hadoop.dfs.replication          1

# --- SQL ---
spark.sql.adaptive.enabled            true
# Mặc định 200 partition sau shuffle là quá nhiều cho dữ liệu ~700 MB
spark.sql.shuffle.partitions          24
# Chuyển dữ liệu JVM <-> pandas theo cột bằng Arrow (nhanh hơn nhiều so với từng dòng)
spark.sql.execution.arrow.pyspark.enabled  true
spark.sql.session.timeZone            UTC
spark.serializer                      org.apache.spark.serializer.KryoSerializer

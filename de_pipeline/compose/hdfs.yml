# HDFS: 1 NameNode + 1 DataNode (giai đoạn 1).
# Lưu ý: đường dẫn tương đối trong file này tính từ thư mục compose/, không phải từ de_pipeline/.

services:
  namenode:
    image: ${HADOOP_IMAGE}
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file: ../docker/hadoop/hadoop.env
    environment:
      # Nếu thư mục này chưa tồn tại thì image tự chạy `hdfs namenode -format` (chỉ lần đầu)
      ENSURE_NAMENODE_DIR: /data/hdfs/name
    ports:
      - "${BIND_ADDR}:${HDFS_UI_PORT}:9870"
    volumes:
      - namenode_data:/data
      - ../docker/hadoop/exclude:/opt/hadoop-exclude:ro
      # CSV gốc và mô hình, chỉ đọc. Mount vào /raw vì /data đã dành cho dữ liệu HDFS
      - ../../data:/raw:ro
      - ../../mlops_artifacts:/artifacts:ro
    mem_limit: 1g
    healthcheck:
      # Chỉ cần NameNode phản hồi. KHÔNG đòi safemode OFF: sau khi khởi động lại với dữ liệu cũ, NameNode ở safemode
      # cho tới khi DataNode báo block, mà DataNode lại chờ NameNode healthy mới chạy -> hai bên chờ nhau mãi.
      test: ["CMD-SHELL", "/opt/hadoop/bin/hdfs dfsadmin -safemode get | grep -q 'Safe mode is'"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  datanode1:
    image: ${HADOOP_IMAGE}
    hostname: datanode1
    command: ["hdfs", "datanode"]
    env_file: ../docker/hadoop/hadoop.env
    volumes:
      - datanode1_data:/data
    depends_on:
      namenode:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

volumes:
  namenode_data:
  datanode1_data:

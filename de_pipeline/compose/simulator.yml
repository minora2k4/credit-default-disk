# Bộ giả lập hồ sơ vay (giai đoạn 2). Chỉ chạy khi gọi --profile sim:
#   docker compose --profile sim build simulator
#   docker compose --profile sim run --rm simulator python simulator/build_pool.py
services:
  simulator:
    build: ../docker/simulator
    image: credit-simulator:local
    profiles: ["sim"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Chạy bằng uid của bạn để file ghi ra work/ không bị chủ sở hữu root
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ..:/opt/pipeline          # code + thư mục work/ (ghi được)
      - ../../data:/data:ro       # CSV gốc, chỉ đọc
    # build_pool.py cần ~2 GB (pandas đọc CSV); producer chạy nhẹ hơn nhiều
    mem_limit: 2g

  # Bộ sinh dữ liệu tổng hợp (SDV): image riêng vì SDV kéo theo torch
  #   docker compose --profile sim build synthesizer
  #   docker compose --profile sim run --rm synthesizer python simulator/synthesize_pool.py
  synthesizer:
    build: ../docker/synth
    image: credit-synthesizer:local
    profiles: ["sim"]
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ..:/opt/pipeline
      - ../../data:/data:ro
    # Đo thực tế: đỉnh RAM ~1.9 GB khi fit SDV trên 255 nghìn dòng
    mem_limit: 4g

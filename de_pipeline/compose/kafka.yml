# Kafka 1 node, chế độ KRaft "combined" (vừa broker vừa controller), không ZooKeeper (giai đoạn 2).
# Image apache/kafka đọc các biến KAFKA_* và đổi thành server.properties
# (KAFKA_NUM_PARTITIONS -> num.partitions; dấu _ thành dấu .).

services:
  kafka:
    image: ${KAFKA_IMAGE}
    hostname: kafka
    environment:
      # Image yêu cầu biến tên CLUSTER_ID; lần chạy đầu nó tự format thư mục log bằng ID này
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # --- Vai trò node ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listener: nơi broker LẮNG NGHE ---
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # --- Địa chỉ broker BÁO cho client để kết nối lại ---
      #   INTERNAL: container trong network credit-net dùng kafka:9092
      #   EXTERNAL: client chạy trên host dùng localhost:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Cụm 1 node nên các topic nội bộ chỉ có 1 bản sao ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # Gõ sai tên topic thì báo lỗi ngay, không âm thầm tạo topic mới
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Consumer group đầu tiên không phải chờ 3 giây trước khi nhận partition
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Heap nhỏ hơn mem_limit để chừa chỗ cho bộ nhớ ngoài heap
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "${BIND_ADDR}:${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Chạy một lần để tạo topic của pipeline: docker compose run --rm kafka-init
  kafka-init:
    image: ${KAFKA_IMAGE}
    command: ["bash", "/scripts/create-topics.sh"]
    volumes:
      - ../docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # Giao diện web xem topic, message, consumer group. Chỉ chạy khi bật profile ui:
  #   docker compose --profile ui up -d kafka-ui
  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    profiles: ["ui"]
    environment:
      KAFKA_CLUSTERS_0_NAME: credit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx384m
    ports:
      - "${BIND_ADDR}:${KAFKA_UI_PORT}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  kafka_data:

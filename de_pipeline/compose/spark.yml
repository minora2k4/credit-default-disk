# Spark standalone: 1 master + 1 worker (giai đoạn 3). Tất cả dùng chung một image tự build.
# Docker Desktop chỉ có 7 GB RAM nên worker nhỏ hơn dự kiến ban đầu; chỉnh bằng biến trong .env.
x-spark-image: &spark-image
  build: ../docker/spark
  image: credit-spark:local

services:
  spark-master:
    <<: *spark-image
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_DAEMON_MEMORY: 512m          # heap của tiến trình master
    ports:
      - "${BIND_ADDR}:${SPARK_MASTER_UI_PORT}:8080"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  spark-worker-1:
    <<: *spark-image
    hostname: spark-worker-1
    # Foreground (spark-class) thay vì start-worker.sh để container sống cùng tiến trình và log ra stdout
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}", "--webui-port", "8081", "--work-dir", "/tmp/spark-worker"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "${BIND_ADDR}:${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ..:/opt/pipeline:ro   # Python worker của executor import credit_pipeline từ đây
    depends_on:
      spark-master:
        condition: service_healthy
    # Trong container này còn chạy cả executor (JVM) lẫn các Python worker, nên giới hạn lớn hơn SPARK_WORKER_MEMORY
    mem_limit: 4g
    restart: unless-stopped

  # Chạy lệnh một lần: docker compose --profile tools run --rm spark-client spark-submit ...
  spark-client:
    <<: *spark-image
    profiles: ["tools"]
    volumes:
      - ..:/opt/pipeline
    mem_limit: 1536m
    command: ["bash"]

  # JupyterLab để học Spark tương tác: docker compose --profile notebook up -d spark-notebook
  spark-notebook:
    <<: *spark-image
    profiles: ["notebook"]
    command: ["python3", "-m", "jupyterlab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
              "--notebook-dir=/opt/pipeline/notebooks", "--IdentityProvider.token=", "--ServerApp.password="]
    environment:
      JUPYTER_RUNTIME_DIR: /tmp/jupyter
    volumes:
      - ..:/opt/pipeline
    ports:
      # Cổng 4040: giao diện Spark của notebook đang mở SparkSession
      - "${BIND_ADDR}:${JUPYTER_PORT}:8888"
      - "${BIND_ADDR}:${SPARK_DRIVER_UI_PORT}:4040"
    depends_on:
      spark-master:
        condition: service_healthy
    mem_limit: 1536m
    restart: "no"
